{% extends "base.html" %}
{% block content %}
<h1>Circle Area</h1>
<form method="POST">
  <input type="number" step="any" name="radius" placeholder="Radius" required>
  <button type="submit">Compute</button>
</form>
{% if result is not none %}
<p>Area = {{ result }}</p>
{% endif %}
{% endblock %}
